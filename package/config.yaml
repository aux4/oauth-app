# aux4/api route map for the OAuth app CORE.
#
# The core only hosts: it contributes the shared /health route and the api/oauth
# machinery. Each provider PLUGIN (aux4/oauth-app-google, aux4/oauth-app-x, ...)
# depends on this core and brings its OWN routes (its own URI structure) plus the
# provider commands under the shared `oauth-app` profile. When several plugins are
# deployed to one machine, the cloud merges every package's config.api.
config:
  api:
    "GET /health":
      command: aux4 oauth-app health
    # Poll endpoint (shared, provider-agnostic): the CLI polls this with its
    # session id until the code is ready. Each provider PLUGIN owns its own
    # /{provider}/callback route (pointing at the shared `oauth-app callback`
    # handler), keeping the URI structure with the plugin.
    "GET /session/{id}":
      command: aux4 oauth-app poll
